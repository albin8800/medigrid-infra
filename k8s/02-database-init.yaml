apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
  namespace: medigrid
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS stores (
        id VARCHAR(50) PRIMARY KEY,
        name VARCHAR(255) NOT NULL,
        license_number VARCHAR(100) UNIQUE NOT NULL,
        email VARCHAR(255) UNIQUE NOT NULL,
        password_hash VARCHAR(255) NOT NULL,
        phone VARCHAR(50),
        address TEXT,
        city VARCHAR(100),
        latitude DOUBLE PRECISION,
        longitude DOUBLE PRECISION,
        status VARCHAR(50) DEFAULT 'ACTIVE',
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS medicines (
        id VARCHAR(50) PRIMARY KEY,
        store_id VARCHAR(50),
        name VARCHAR(255) NOT NULL,
        generic_name VARCHAR(255),
        category VARCHAR(100),
        dosage VARCHAR(100),
        manufacturer VARCHAR(255),
        batch_number VARCHAR(100),
        expiry_date VARCHAR(50),
        price NUMERIC(10, 2) DEFAULT 0,
        stock_quantity INTEGER DEFAULT 0,
        reorder_level INTEGER DEFAULT 10,
        in_stock BOOLEAN DEFAULT TRUE,
        location_rack VARCHAR(100),
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS store_inventories (
        id VARCHAR(50) PRIMARY KEY,
        store_id VARCHAR(50) REFERENCES stores(id) ON DELETE CASCADE,
        medicine_id VARCHAR(50) REFERENCES medicines(id) ON DELETE CASCADE,
        stock_quantity INTEGER NOT NULL DEFAULT 0,
        unit_price DECIMAL(10, 2) NOT NULL,
        expiry_date DATE,
        batch_number VARCHAR(100),
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        CONSTRAINT unique_store_medicine UNIQUE (store_id, medicine_id)
    );

    CREATE TABLE IF NOT EXISTS orders (
        id VARCHAR(50) PRIMARY KEY,
        customer_id VARCHAR(50) NOT NULL,
        store_id VARCHAR(50) NOT NULL,
        status VARCHAR(50) NOT NULL DEFAULT 'PENDING', 
        total_amount DECIMAL(10, 2) NOT NULL, 
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP, 
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS order_items ( 
        id VARCHAR(50) PRIMARY KEY, 
        order_id VARCHAR(50) REFERENCES orders(id) ON DELETE CASCADE, 
        medicine_id VARCHAR(50) NOT NULL,
        quantity INTEGER NOT NULL,
        unit_price DECIMAL(10, 2) NOT NULL
    );
    
    CREATE TABLE IF NOT EXISTS bills (
        bill_id VARCHAR(50) PRIMARY KEY,
        order_id VARCHAR(50),
        store_id VARCHAR(50) NOT NULL,
        customer_name VARCHAR(255) NOT NULL,
        customer_phone VARCHAR(50),
        items TEXT,
        subtotal DECIMAL(10, 2) NOT NULL,
        discount_amount DECIMAL(10, 2) DEFAULT 0,
        tax_amount DECIMAL(10, 2) NOT NULL,
        total_amount DECIMAL(10, 2) DEFAULT 0,
        final_total DECIMAL(10, 2) DEFAULT 0,
        payment_method VARCHAR(50) NOT NULL,
        payment_status VARCHAR(50) NOT NULL DEFAULT 'COMPLETED',
        status VARCHAR(50) DEFAULT 'PAID',
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );
