apiVersion: v1
kind: ConfigMap
metadata:
  name: medigrid-config
  namespace: medigrid
data:
  NODE_ENV: "development"
  PORT: "5001"
  PHARMACY_SERVICE_PORT: "5001"
  ORDER_SERVICE_PORT: "5002"
  PHARMACY_SERVICE_URL: "http://pharmacy-service:5001"
  CATALOG_SERVICE_URL: "http://pharmacy-service:5001"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_URL: "redis://redis:6379"
  USE_REAL_DB: "true"
  DATABASE_URL: "postgres://medigrid:medigrid_password@postgres:5432/medigrid_db"
  ADMIN_EMAIL: "admin@medigrid.com"

---
apiVersion: v1
kind: Secret
metadata:
  name: medigrid-secrets
  namespace: medigrid
type: Opaque
stringData:
  ADMIN_PASSWORD: "admin123"
  POSTGRES_PASSWORD: "medigrid_password"
  POSTGRES_USER: "medigrid"
  POSTGRES_DB: "medigrid_db"
